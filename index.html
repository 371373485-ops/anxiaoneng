<title>分公司经营与效能数据看板 - 2026年4月</title>

<link rel="stylesheet" href="pages/unlock.css?v=20260623">
<script src="chart.umd.min.js"></script>
<script src="xlsx.full.min.js"></script>
<style>
:root{--bg:#f0f2f5;--card:#fff;--text:#1a1a2e;--muted:#888;--blue:#3b82f6;--green:#10b981;--red:#ef4444;--purple:#8b5cf6;--amber:#f59e0b}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);font-size:14px}
.header{background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);color:#fff;padding:12px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.header h1{font-size:20px;font-weight:600}
.header .sub{font-size:12px;opacity:.7}
/* ── Toolbar System ── */
.toolbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;line-height:1}
.toolbar__group{display:inline-flex;align-items:center;gap:6px}
.toolbar__sep{width:1px;height:20px;background:rgba(255,255,255,.2);flex-shrink:0}
.toolbar label{font-size:12px;color:rgba(255,255,255,.7);white-space:nowrap}
/* Unified control: same height for button/a/label/select */
.toolbar button,
.toolbar .btn-file,
.toolbar .btn-dl,
.toolbar select{
  height:32px;
  padding:0 12px;
  border:1px solid rgba(255,255,255,.25);
  border-radius:6px;
  background:rgba(255,255,255,.08);
  color:#fff;
  font-size:12px;
  cursor:pointer;
  transition:background .15s,border-color .15s;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  white-space:nowrap;
  line-height:1;
  text-decoration:none;
  box-sizing:border-box;
  font-family:inherit;
  appearance:none;
  -webkit-appearance:none
}
.toolbar button:hover,
.toolbar .btn-file:hover,
.toolbar .btn-dl:hover{
  background:rgba(255,255,255,.18);
  border-color:rgba(255,255,255,.4)
}
.toolbar select:hover{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.4)}
.toolbar select option{color:#1a1a2e;background:#fff}
/* Compare button accent */
#btnCompare{
  background:rgba(59,130,246,.22);
  border-color:rgba(99,179,237,.45);
  font-weight:600;
  letter-spacing:.3px
}
#btnCompare:hover{background:rgba(59,130,246,.35);border-color:rgba(147,197,253,.6)}
.toolbar input[type=file]{display:none}
.nav{display:flex;background:var(--card);padding:0 24px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.nav button{padding:12px 20px;border:none;background:none;font-size:14px;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent}
.nav button:hover{color:var(--text)}
.nav button.active{color:#0f3460;border-bottom-color:#0f3460;font-weight:600}
.main{padding:20px 24px;max-width:1600px;margin:0 auto}
.tab{display:none}.tab.active{display:block;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

.kpi-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:20px}
.kpi-card{background:var(--card);border-radius:8px;padding:14px 16px;box-shadow:0 1px 4px rgba(0,0,0,.06);border-left:4px solid var(--blue)}
.kpi-card.c-green{border-left-color:var(--green)}.kpi-card.c-red{border-left-color:var(--red)}.kpi-card.c-purple{border-left-color:var(--purple)}.kpi-card.c-amber{border-left-color:var(--amber)}
.kpi-card .kl{font-size:12px;color:var(--muted);margin-bottom:4px}
.kpi-card .kv{font-size:22px;font-weight:700}

.section{margin-bottom:16px}
.sec-header{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--card);border-radius:8px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.06);user-select:none}
.sec-header:hover{background:#f8f9ff}
.sec-header .arrow{transition:.2s;font-size:10px;color:var(--muted)}
.sec-header.open .arrow{transform:rotate(90deg)}
h4.open .arrow{transform:rotate(90deg)}
.sec-header h3{font-size:14px;font-weight:600}
.sec-header .badge{font-size:11px;background:#e0e7ff;color:#3730a3;padding:2px 8px;border-radius:10px}
.sec-body{display:none;padding:12px 0}
.sec-body.open{display:block}
.sec-group{margin-bottom:10px}

.tbl-wrap{overflow-x:auto;background:var(--card);border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.06);margin-bottom:12px;max-height:70vh;overflow-y:auto;background-image:linear-gradient(to right,var(--card) 30%,transparent),linear-gradient(to left,var(--card) 30%,transparent),radial-gradient(farthest-side at 0 50%,rgba(0,0,0,.12),transparent),radial-gradient(farthest-side at 100% 50%,rgba(0,0,0,.12),transparent);background-position:0 0,100% 0,0 0,100% 0;background-repeat:no-repeat;background-size:40px 100%,40px 100%,14px 100%,14px 100%;background-attachment:local,local,scroll,scroll}
.tbl-wrap table th{position:sticky;top:0;z-index:9;background:#f0f4ff}
.tbl-wrap table th:nth-child(1){left:0;z-index:8}
.tbl-wrap table td:nth-child(1){position:sticky;left:0;z-index:4;background:var(--card)}
.tbl-wrap tr:nth-child(even) td{background:#fafafa}
.tbl-wrap tr:nth-child(even) td:nth-child(1){background:#fafafa}
.tbl-wrap tr:nth-child(even) td:nth-child(2){background:#fafafa}
.tbl-wrap tr:nth-child(even) td:nth-child(3){background:#fafafa}
.tbl-wrap tr:hover td{background:#f0f4ff}
.tbl-wrap tr:hover td:nth-child(1){background:#f0f4ff}
.tbl-wrap tr:hover td:nth-child(2){background:#f0f4ff}
.tbl-wrap tr:hover td:nth-child(3){background:#f0f4ff}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:12px}
th{text-align:left;padding:8px 10px;background:#f8f9fa;color:var(--muted);font-weight:600;border-bottom:2px solid #e5e7eb;white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid #f0f0f0;white-space:nowrap}
tr:hover td{background:#f8f9ff}
.num{text-align:right;font-variant-numeric:tabular-nums}
.hi-green{color:var(--green);font-weight:600}
.hi-red{color:var(--red);font-weight:600}
/* 责任区核心指标表 & 分公司明细表 & 分公司详情表 — 统一黑色字体 */
#branches-table .hi-green,#branches-table .hi-red,#regions-key-table .hi-green,#regions-key-table .hi-red,#branch-detail-view .hi-green,#branch-detail-view .hi-red{color:#1a1a2e!important;font-weight:400}
.computed{color:var(--muted);font-size:11px}

.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:12px}
.chart-grid.compare-mode{grid-template-columns:1fr;max-width:900px}
.chart-grid.compare-mode .chart-wrap{min-height:340px}
.chart-card{background:var(--card);border-radius:8px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.chart-card h4{font-size:12px;margin-bottom:10px;color:var(--muted);font-weight:600}
.chart-wrap{position:relative;min-height:260px}

.region-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.region-card{background:var(--card);border-radius:8px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.region-card h4{font-size:13px;margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid var(--blue)}
.region-card .metric{display:flex;justify-content:space-between;padding:4px 0;font-size:12px;border-bottom:1px solid #f5f5f5}
.region-card .metric .mv{font-weight:600}

.search-bar{display:flex;gap:8px;margin-bottom:16px;align-items:center}
.search-bar input,.search-bar select{padding:6px 12px;border:1px solid #d1d5db;border-radius:6px;font-size:13px}
.search-bar input{width:200px}

.more-toggle{display:flex;align-items:center;gap:6px;padding:8px 0;cursor:pointer;color:var(--muted);font-size:12px;user-select:none}
.more-toggle:hover{color:var(--blue)}
.more-toggle .mt-arrow{transition:.2s;font-size:10px}
.more-toggle.open .mt-arrow{transform:rotate(90deg)}
.more-body{display:none}
.more-body.open{display:block}
.branch-charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.branch-charts .chart-card{background:var(--bg2);border-radius:10px;padding:14px 16px;border:1px solid var(--border);margin-bottom:0!important}
.branch-charts .chart-card h4{font-size:13px;margin:0 0 10px 0;color:var(--text);font-weight:600}
.branch-charts .chart-wrap{background:#fafbfc;border-radius:6px;padding:4px}

@media(max-width:1200px){.chart-grid{grid-template-columns:1fr}}
@media(max-width:1000px){.region-grid{grid-template-columns:repeat(2,1fr)}.kpi-row{grid-template-columns:repeat(3,1fr)}}
@media(max-width:600px){.region-grid{grid-template-columns:1fr}.kpi-row{grid-template-columns:repeat(2,1fr)}}

.month-bar{display:flex;align-items:center;gap:8px}
.month-bar select{padding:4px 10px;border:1px solid rgba(255,255,255,.3);border-radius:6px;background:rgba(255,255,255,.1);color:#fff;font-size:13px;cursor:pointer;outline:none}
.month-bar select option{color:#333;background:#fff}
.month-bar .btn-reset{padding:4px 10px;border:1px solid rgba(255,255,255,.15);border-radius:6px;background:transparent;color:rgba(255,255,255,.6);cursor:pointer;font-size:11px}
.month-bar .btn-reset:hover{color:#fff;border-color:rgba(255,255,255,.5)}

.plan-bar{display:flex;align-items:center;gap:6px}
.month-bar select#planSelect{padding:4px 8px;border:1px solid rgba(255,255,255,.2);border-radius:6px;background:rgba(255,255,255,.08);color:rgba(255,255,255,.7);font-size:12px;cursor:pointer;outline:none;max-width:180px}
.month-bar select#planSelect option{color:#333;background:#fff}

.btn-dl{display:inline-flex;align-items:center;justify-content:center;height:34px;padding:0 10px;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:6px;font-size:12px;text-decoration:none;cursor:pointer;white-space:nowrap;line-height:1}.btn-dl:hover{background:rgba(255,255,255,.2)}

/* Branch Detail */
.breadcrumb{margin-bottom:16px;font-size:13px}
.breadcrumb a{color:var(--primary);cursor:pointer;text-decoration:none}
.breadcrumb a:hover{text-decoration:underline}
.branch-header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.branch-header h2{margin:0;font-size:22px}
.badge-rank{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:600}
.badge-rank.top{background:#d4edda;color:#155724}
.badge-rank.mid{background:#fff3cd;color:#856404}
.badge-rank.low{background:#f8d7da;color:#721c24}
.back-btn{display:inline-flex;align-items:center;gap:4px;padding:6px 14px;border:none;border-radius:6px;background:var(--bg2);color:var(--text);cursor:pointer;font-size:13px;margin-bottom:16px}
.back-btn:hover{background:var(--border)}
.kpi-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:20px}
.kpi-card{background:var(--bg2);border-radius:8px;padding:14px 16px;border-left:3px solid var(--primary)}
.kpi-card h4{font-size:12px;color:var(--text2);margin:0 0 8px 0}
.kpi-card .val{font-size:24px;font-weight:700;margin-bottom:4px}
.kpi-card .avg{font-size:12px;color:var(--text2);margin-bottom:6px}
.kpi-card .diff{font-size:12px;margin-bottom:4px}
.kpi-card .rank{font-size:11px;color:var(--text2)}
.diff-up{color:#16a34a}
.diff-down{color:#dc2626}
.rank-bar{display:flex;align-items:center;gap:6px}
.rank-bar .bar-track{flex:1;height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.rank-bar .bar-fill{height:100%;border-radius:2px;transition:width .3s}
.col-rank{width:60px;text-align:center}
.clickable-row{cursor:pointer;transition:background .15s}
.clickable-row:hover{background:rgba(59,130,246,.06)}


.sortable{cursor:pointer;user-select:none;white-space:nowrap}
.sortable:hover{background:rgba(59,130,246,.08)}
.mt-arrow{display:inline-block;font-size:10px;transition:transform .2s}
.more-toggle.open .mt-arrow{transform:rotate(90deg)}


.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:10000;padding:10px 24px;border-radius:8px;font-size:13px;font-weight:600;box-shadow:0 4px 20px rgba(0,0,0,.15);animation:toastIn .3s ease,toastOut .3s ease 2.5s forwards;pointer-events:none}
.toast-success{background:#d4edda;color:#155724;border:1px solid #c3e6cb}
.toast-error{background:#f8d7da;color:#721c24;border:1px solid #f5c6cb}
.toast-info{background:#d1ecf1;color:#0c5460;border:1px solid #bee5eb}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes toastOut{from{opacity:1}to{opacity:0;transform:translateX(-50%) translateY(-10px)}}

/* Data management */
.data-year{margin-bottom:24px}
.data-year h3{font-size:15px;margin-bottom:10px;color:#1a1a2e}
.month-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:8px;margin-bottom:8px}
.month-cell{background:var(--card);border-radius:6px;padding:10px 8px;text-align:center;font-size:11px;box-shadow:0 1px 3px rgba(0,0,0,.04);cursor:default;transition:.15s}
.month-cell.has-data{background:#e8f5e9;border:1px solid #a5d6a7;color:#2e7d32;font-weight:600}
.month-cell.no-data{background:#fafafa;border:1px dashed #e0e0e0;color:#bbb}
.month-cell:hover{transform:translateY(-1px);box-shadow:0 3px 8px rgba(0,0,0,.08)}
.month-cell .mon{font-size:18px;font-weight:700;display:block;margin-bottom:2px}
.month-cell .yr{font-size:10px;opacity:.6}
.plan-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.plan-card{background:var(--card);border-radius:8px;padding:10px 14px;box-shadow:0 1px 3px rgba(0,0,0,.04);display:flex;align-items:center;gap:10px;font-size:12px}
.plan-card .vers{font-weight:600;color:#0f3460;font-size:14px}
.plan-card .info{color:var(--muted);font-size:11px}
.plan-card .plan-actions{margin-left:auto;display:flex;gap:4px}
.data-section{margin-bottom:20px}
.data-section h4{font-size:13px;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.data-actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.btn-sm{padding:4px 10px;font-size:11px;border-radius:4px;border:1px solid #ddd;background:#fff;cursor:pointer;transition:.15s}
.btn-sm:hover{background:#f5f5f5}
.btn-sm.danger{color:#c62828;border-color:#ef9a9a}
.btn-sm.danger:hover{background:#ffebee}
.btn-sm.warn{color:#e65100;border-color:#ffcc80}
.btn-sm.warn:hover{background:#fff3e0}
.trend-show-btn{padding:6px 16px;border:1px solid #2563eb;border-radius:6px;background:#2563eb;color:#fff;cursor:pointer;font-size:12px;font-weight:600;transition:.15s}
.trend-show-btn:hover{background:#1d4ed8;border-color:#1d4ed8}
.trend-show-btn:focus-visible{outline:2px solid #93c5fd;outline-offset:2px}
.trend-summary{margin-top:12px;padding:12px 14px;border-left:3px solid #2563eb;border-radius:6px;background:#f5f8ff;color:var(--text);font-size:12px;line-height:1.7}
.trend-summary strong{color:#1d4ed8}
.import-time{font-size:10px;color:var(--muted)}

/* KPI card delta badge */
.kpi-delta{font-size:10px;margin-top:4px;padding:2px 6px;border-radius:4px;background:rgba(0,0,0,.04);display:inline-block}
/* Compare column styling */
.cmp-hdr{background:#e8f0fe!important;color:#1e40af;font-weight:600}
.cmp-data{color:#666;background:rgba(59,130,246,.04)}
.cmp-delta{font-variant-numeric:tabular-nums}
/* Overview section row highlight in compare mode */
:root{--cmp-bg:rgba(239,246,255,.5)}
tr:nth-child(even) .cmp-delta{background:rgba(239,246,255,.6)!important}
tr:nth-child(even) .cmp-data{background:rgba(59,130,246,.06)!important}
/* Chart grid in compare mode — increased spacing */
.chart-grid.compare-mode .chart-wrap{min-height:420px;margin-bottom:24px}
.chart-grid.compare-mode .chart-card{padding:14px 18px}
.chart-grid.compare-mode canvas{max-height:380px}
/* Branches table compare column — warm highlight */
td.cmp-delta{transition:background .2s}
.tbl-wrap tbody tr:hover td.cmp-delta{background:#fef3c7!important}
.alert-bar{position:sticky;top:0;z-index:100;background:#fff;border-bottom:1px solid #fee2e2;box-shadow:0 2px 8px rgba(0,0,0,.06)}.alert-bar .alert-summary{padding:8px 16px;color:#991b1b;user-select:none}.alert-bar .alert-detail{padding:0 16px 8px}.alert-bar .alert-toggle{font-size:10px;margin-left:8px;color:#999}.alert-item{transition:background .2s}.alert-item:hover{filter:brightness(.97)}
/* Export tab */
.exp-section{background:var(--card);border-radius:8px;padding:16px 20px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.exp-section h3{font-size:14px;color:#1e3a5f;margin-bottom:10px}
.exp-check{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:3px 8px;border:1px solid #e5e7eb;border-radius:6px;margin:2px 4px 2px 0;cursor:pointer;white-space:nowrap;user-select:none;transition:.15s}
.exp-check:hover{border-color:var(--blue);background:#eff6ff}
.exp-check input[type=checkbox]{accent-color:var(--blue)}
.exp-sel-all{padding:2px 10px;border:1px solid #d1d5db;border-radius:4px;background:#f9fafb;cursor:pointer;font-size:11px;color:#6b7280;margin-right:4px;transition:.15s}
.exp-sel-all:hover{background:#e5e7eb;color:#374151}
.exp-sel-card{padding:1px 8px;font-size:10px;border:1px solid rgba(0,0,0,.12);border-radius:3px;background:rgba(255,255,255,.7);cursor:pointer;transition:.15s}
.exp-sel-card:hover{background:#fff;border-color:rgba(0,0,0,.25)}
.exp-check-card:hover{background:rgba(255,255,255,.6) !important}
.exp-btn-primary{padding:8px 20px;background:var(--blue);color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600;transition:.2s}
.exp-btn-primary:hover{filter:brightness(1.1)}
.exp-branch-label{min-width:110px}

/* ========== 移动端适配 ========== */
@media(max-width:768px){
  /* ── Header & Toolbar ── */
  .header{padding:10px 12px;flex-direction:column;align-items:flex-start}
  .header h1{font-size:16px}
  .header .sub{font-size:10px;display:block;margin-top:2px}
  .toolbar{gap:4px}
  .toolbar__group{gap:4px}
  .toolbar button,.toolbar .btn-file,.toolbar .btn-dl,.toolbar select{height:28px;padding:0 8px;font-size:11px;border-radius:4px}
  .toolbar label{font-size:11px}
  .toolbar__sep{height:16px}

  /* ── Compare bar ── */
  #compareBar{flex-wrap:wrap;padding:6px 10px;gap:4px;font-size:11px}
  #compareBar select{padding:2px 6px;font-size:10px}
  #compareBar button{padding:2px 6px;font-size:10px}

  /* ── Navigation ── */
  .nav{padding:0 8px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .nav button{padding:8px 10px;font-size:11px;white-space:nowrap;flex-shrink:0}

  /* ── Main content ── */
  .main{padding:12px 8px}

  /* ── KPI cards ── */
  .kpi-row{grid-template-columns:1fr 1fr;gap:8px}
  .kpi-card{padding:10px 12px}
  .kpi-card .kv{font-size:18px}
  .kpi-card .kl{font-size:10px}

  /* ── Section headers ── */
  .sec-header{padding:8px 10px}
  .sec-header h3{font-size:12px}

  /* ── Region grid ── */
  .region-grid{grid-template-columns:1fr;gap:8px}
  .region-card{padding:10px 12px}
  .region-card h4{font-size:11px}
  .region-card .metric{font-size:10px}

  /* ── Chart grid ── */
  .chart-grid{grid-template-columns:1fr;gap:10px}
  .chart-card{padding:8px 10px}
  .chart-card h4{font-size:11px}
  .chart-wrap{min-height:200px}
  .chart-grid.compare-mode .chart-wrap{min-height:240px}

  /* ── Branch search ── */
  .search-bar{flex-wrap:wrap;gap:4px}
  .search-bar input{width:100%}
  .search-bar select{font-size:11px;padding:4px 8px}

  /* ── Branch table ── */
  .tbl-wrap{max-height:55vh;font-size:10px}
  .tbl-wrap table{font-size:10px}
  .tbl-wrap th,.tbl-wrap td{padding:5px 6px}
  /* ── Branch detail ── */
  .branch-header{flex-wrap:wrap;gap:6px}
  .branch-header h2{font-size:16px}
  .kpi-cards{grid-template-columns:1fr 1fr;gap:8px}
  .kpi-card .val{font-size:18px}
  .branch-charts{grid-template-columns:1fr}

  /* ── Trend section ── */
  #trend-chart-wrap{height:220px}

  /* ── Data management ── */
  .data-year h3{font-size:13px}
  .month-grid{grid-template-columns:repeat(6,1fr);gap:4px}
  .month-cell{padding:6px 4px;font-size:9px}
  .month-cell .mon{font-size:14px}
  .plan-card{width:100%}

  /* ── Export tab ── */
  .exp-section{padding:10px 12px;margin-bottom:10px}
  .exp-section h3{font-size:12px}
  .exp-check{padding:2px 6px;font-size:10px}
  .exp-sel-all{padding:1px 6px;font-size:9px}
  .exp-btn-primary{padding:6px 14px;font-size:13px;width:100%}

  /* ── Alert bar ── */
  .alert-bar .alert-summary{padding:6px 10px;font-size:11px}
  .alert-bar .alert-detail{padding:0 10px 6px;font-size:10px}

  /* ── Breadcrumb ── */
  .breadcrumb{font-size:11px}

  /* ── Toast ── */
  .toast{font-size:11px;padding:8px 16px}
}

@media(max-width:480px){
