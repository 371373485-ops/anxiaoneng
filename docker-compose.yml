services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: diagnosis
      POSTGRES_USER: diagnosis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - diagnosis_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diagnosis"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      AUTH_MODE: ${AUTH_MODE:-proxy}
      DATABASE_URL: postgresql://diagnosis:${POSTGRES_PASSWORD:-change-me}@db:5432/diagnosis
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:-}
      AI_ENABLED: ${AI_ENABLED:-false}
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      ZHIPU_MODEL: ${ZHIPU_MODEL:-glm-4-flash}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8000}

volumes:
  diagnosis_pgdata:
