services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: diagnosis
      POSTGRES_USER: diagnosis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - diagnosis_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diagnosis -d diagnosis"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    expose: ["8000"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      AUTH_MODE: proxy
      DATABASE_URL: postgresql://diagnosis:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/diagnosis
      PROXY_SHARED_SECRET: ${PROXY_SHARED_SECRET:?PROXY_SHARED_SECRET is required}
      AI_ENABLED: "false"
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      ZHIPU_MODEL: ${ZHIPU_MODEL:-glm-4-flash}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
      SERVE_FRONTEND: "true"

  admin-gateway:
    image: nginx:1.27-alpine
    environment:
      NGINX_ENVSUBST_FILTER: "^(GATEWAY_|PROXY_SHARED_SECRET)"
      GATEWAY_USER: ${GATEWAY_USER:?GATEWAY_USER is required}
      GATEWAY_ROLE: admin
      GATEWAY_BRANCHES: ${GATEWAY_BRANCHES:-*}
      PROXY_SHARED_SECRET: ${PROXY_SHARED_SECRET:?PROXY_SHARED_SECRET is required}
    volumes:
      - ./ops/admin-nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "127.0.0.1:${ADMIN_GATEWAY_PORT:-8080}:8080"
    depends_on:
      app:
        condition: service_started

  public-gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./ops/public-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ops/proxy_params:/etc/nginx/proxy_params:ro
    ports:
      - "${PUBLIC_GATEWAY_BIND:-0.0.0.0}:${PUBLIC_GATEWAY_PORT:-8081}:8080"
    depends_on:
      app:
        condition: service_started

volumes:
  diagnosis_pgdata:
